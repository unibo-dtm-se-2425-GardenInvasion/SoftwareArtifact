name: deploy
on:
  workflow_call:
  workflow_dispatch:
jobs:
  release:
    concurrency:
      # Only one release job at a time. Strictly sequential.
      group: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write 
      issues: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # all history

      - name: Get All Tags
        run: git fetch --tags -f

      - name: Get Python Version
        id: get-python-version
        run: echo version=$(python setup.py get_minimum_python_version | tail -n 1) >> $GITHUB_OUTPUT

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.get-python-version.outputs.version }}

      - name: Restore Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Change default logging level
        run: sed -i -e 's/DEBUG/WARN/g' GardenInvasion/__init__.py

      - name: Get Node Version
        id: get-node-version
        run: echo version=$(jq -r .engines.node package.json) >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.get-node-version.outputs.version }}

      - name: Release
        run: |
          npm install
          npx semantic-release
        env:
          # RELEASE_DRY_RUN routes the twine upload to TestPyPI instead of real PyPI;
          # TestPyPI is a separate service with its own separate credentials, so the
          # twine username/password must switch together with the upload target.
          TWINE_USERNAME: ${{ contains(github.repository, 'SoftwareArtifact') && '__token__' || secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ contains(github.repository, 'SoftwareArtifact') && secrets.TEST_PYPI_API_TOKEN || secrets.PYPI_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_DRY_RUN: ${{ contains(github.repository, 'SoftwareArtifact') }}
